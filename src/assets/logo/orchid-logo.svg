<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="orchidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(167, 139, 250, 0.4)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>
  </defs>

  <!-- Studio Emblem Icon: Stylized Geometric Orchid / Lens Petals -->
  <g transform="translate(10, 10)">
    <!-- Ambient Aura -->
    <circle cx="30" cy="30" r="28" fill="url(#glowGrad)" filter="blur(8px)" />
    
    <!-- Central Lens Ring -->
    <circle cx="30" cy="30" r="24" stroke="url(#orchidGrad)" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.6" />
    <circle cx="30" cy="30" r="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Petals / Shutter Blades -->
    <path d="M30 10 C38 20 38 40 30 50 C22 40 22 20 30 10 Z" fill="url(#orchidGrad)" fill-opacity="0.85" />
    <path d="M10 30 C20 22 40 22 50 30 C40 38 20 38 10 30 Z" fill="url(#orchidGrad)" fill-opacity="0.65" />
    <circle cx="30" cy="30" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: ORCHID CREATIONS -->
  <g transform="translate(85, 42)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#FFFFFF">
      ORCHID
    </text>
    <text x="135" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="300" letter-spacing="4" fill="#A78BFA">
      CREATIONS
    </text>
    <text x="2" y="18" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#A5A7B0" opacity="0.85">
      POST-PRODUCTION STUDIO • EST. 2019
    </text>
  </g>
</svg>

